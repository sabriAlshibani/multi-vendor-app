<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | Vendor Store</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="images/logo.png" />

</head>

<body>
    <main class="split-container">
        <section class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="brand">
                    <div class="logo-icon">
                        <img src="images/logo.png" alt="">
                    </div>
                    <span class="brand-name">سوق أوفر</span>
                </div>
                <div class="hero-text">
                    <h1>مستقبلك الرقمي يبدأ هنا.</h1>
                    <p>استكشف آلاف الأصول الرقمية والأدوات المتطورة لدعم مشروعك القادم بلمسة احترافية.</p>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="login-box">
                <div class="login-header">
                    <h2 class="login-title">تسجيل الدخول</h2>
                    <p class="login-description">مرحباً بك في عالم المتجهات الرقمية، ادخل بياناتك للمتابعة.</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" placeholder="example@vector.com" required />
                    </div>
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> تذكرني
                        </label>
                        <a href="#" class="forgot-link">فقدت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="login-btn">دخول للمتجر</button>
                </form>

                <div class="divider">
                    <span>أو الدخول السريع عبر</span>
                </div>

                <button class="google-btn" id="googleBtn">
                    <img src="images/google-logo.png" alt="Google">
                    حساب Google
                </button>

                <p class="register-link">عضو جديد؟ <a href="register.html">إنشاء حساب مجاني</a></p>
            </div>
        </section>
    </main>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
